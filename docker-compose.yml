# Projet 2 - Du poste Windows au web sans mot de passe
# Keycloak (IdP SAML, SPNEGO/Kerberos, federation AD) + application SP SAML, sur la VM sso.polycorp.test
name: prj

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      KC_HOSTNAME: http://sso.polycorp.test:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      KC_LOG_LEVEL: "INFO,org.keycloak.federation.kerberos:DEBUG,org.keycloak.authentication.authenticators.browser.SpnegoAuthenticator:DEBUG"
      JAVA_OPTS_APPEND: "-Djava.security.krb5.conf=/etc/krb5.conf"
      JAVA_OPTS_KC_HEAP: -XX:MaxRAMPercentage=55
    ports:
      - "8080:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak/krb5.conf:/etc/krb5.conf:ro
      - ./keycloak/sso.keytab:/opt/keycloak/conf/sso.keytab:ro
    mem_limit: 2000m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  app:
    build: ./app
    image: prj-app:1.0
    command: gunicorn -b 0.0.0.0:8000 -w 1 --threads 4 sp_saml:app
    environment:
      SP_BASE: http://app.polycorp.test:8181
      IDP_METADATA_URL: http://keycloak:8080/realms/polycorp/protocol/saml/descriptor
    ports:
      - "8181:8000"
    mem_limit: 200m
    restart: unless-stopped

volumes:
  keycloak-data:
