[libdefaults]
 default_realm = POLYCORP.TEST
 dns_lookup_kdc = true
 dns_lookup_realm = false
 rdns = false
 dns_canonicalize_hostname = false
 udp_preference_limit = 1
 permitted_enctypes = aes256-cts-hmac-sha1-96 aes128-cts-hmac-sha1-96

[realms]
 POLYCORP.TEST = {
  kdc = dc01.polycorp.test
 }

[domain_realm]
 .polycorp.test = POLYCORP.TEST
 polycorp.test = POLYCORP.TEST
